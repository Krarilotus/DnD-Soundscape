<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DnD-Soundscape – Adventure Audio Manager & DM Soundboard</title>
  <meta name="description" content="Professional adventure audio management system, multi-layer soundboard, and stage orchestrator for tabletop RPGs and D&D 5e Dungeon Masters.">
  
  <!-- PWA & Mobile Installability -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#090a0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DnD Soundscape">
  <link rel="apple-touch-icon" href="img/icons/icon.svg">
  <link rel="icon" type="image/svg+xml" href="img/icons/icon.svg">

  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/hub.css">
  <link rel="stylesheet" href="css/stage.css">
  <link rel="stylesheet" href="css/mixer.css">
  <link rel="stylesheet" href="css/editor.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div id="app-root">
    <!-- Top Navigation Bar -->
    <header class="top-navbar" role="banner">
      <div id="btn-brand-home" class="brand-section" title="DnD-Soundscape Hub">
        <span class="brand-logo">🏔️</span>
        <span class="brand-title">DnD-Soundscape</span>
        <span class="badge">v1.0.0</span>
      </div>

      <div class="nav-controls">
        <!-- Quick Adventure Switcher -->
        <div class="nav-adventure-dropdown-group" style="display: flex; align-items: center; gap: 8px;">
          <span style="font-size: 12px; color: var(--text-muted); font-weight: 600;">ADVENTURE:</span>
          <select id="nav-adventure-select" class="form-select" style="padding: 4px 10px; font-size: 13px; min-width: 170px;">
            <option value="phandelver">Lost Mine of Phandelver</option>
          </select>
        </div>

        <button id="btn-nav-hub" class="btn-secondary" title="Adventure Hub & Library">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"/>
            <rect x="14" y="3" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/>
            <rect x="3" y="14" width="7" height="7"/>
          </svg>
          <span class="btn-text">Hub</span>
        </button>

        <button id="btn-nav-studio" class="btn-secondary" title="Adventure Studio / Stage Editor">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 20h9"/>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
          </svg>
          <span class="btn-text">Studio</span>
        </button>

        <button id="btn-nav-mobile" class="btn-secondary" title="Mobile Remote & Phone QR Code">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="5" y="2" width="14" height="20" rx="2" ry="2"/>
            <line x1="12" y1="18" x2="12.01" y2="18"/>
          </svg>
          <span class="btn-text">Mobile</span>
        </button>

        <button id="btn-nav-settings" class="btn-icon" title="Settings (⚙)">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Dynamic View Area (Stage Panorama or Hub Library) -->
    <main id="main-view" class="main-view-container" role="main"></main>

    <!-- Bottom Audio HUD & Live Mixer -->
    <div id="bottom-bar-container"></div>
  </div>

  <!-- Start Web Audio Overlay (Browser Gesture Unlock) -->
  <div id="start-overlay" class="start-overlay">
    <div class="start-card">
      <div class="start-crest">🎲</div>
      <h1 class="start-title">DnD-Soundscape</h1>
      <p class="start-subtitle">Adventure Audio Management & DM Soundboard</p>

      <div class="start-hints-grid">
        <div class="start-hint-item"><kbd>1</kbd>–<kbd>9</kbd> <span>Switch Stages</span></div>
        <div class="start-hint-item"><kbd>Space</kbd> <span>Vorlesen (Ducking)</span></div>
        <div class="start-hint-item"><kbd>M</kbd> <span>3-Layer Mixer</span></div>
        <div class="start-hint-item"><kbd>B</kbd> <span>SFX Soundboard</span></div>
        <div class="start-hint-item"><kbd>Esc</kbd> <span>Silence Fade</span></div>
        <div class="start-hint-item"><kbd>F</kbd> <span>Fullscreen</span></div>
      </div>

      <button id="btn-start-audio" class="btn-start-action">
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
        <span>Click to Start Audio</span>
      </button>
    </div>
  </div>

  <!-- Register PWA Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('DnD-Soundscape PWA Service Worker registered:', reg.scope))
          .catch((err) => console.warn('Service Worker registration failed:', err));
      });
    }
  </script>

  <script type="module" src="js/app.js"></script>
</body>
</html>
