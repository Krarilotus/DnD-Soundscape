<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e2436"/>
      <stop offset="100%" stop-color="#080a10"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae188"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#9a7416"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Shield / Rounded Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="8"/>

  <!-- Mountain Silhouette in Background -->
  <path d="M96 360 L200 210 L270 310 L340 180 L430 360 Z" fill="#131724" opacity="0.8"/>
  <path d="M180 360 L260 230 L340 360 Z" fill="#1c2235" opacity="0.9"/>

  <!-- D20 Geometric Dice with Luminous Gold Lines -->
  <g transform="translate(256, 250) scale(1.1)" filter="url(#glow)">
    <!-- D20 Outer Hexagon -->
    <polygon points="0,-100 86,-50 86,50 0,100 -86,50 -86,-50" fill="rgba(212, 175, 55, 0.12)" stroke="url(#goldGrad)" stroke-width="6" stroke-linejoin="round"/>
    <!-- Inner Triangle -->
    <polygon points="0,-100 0,35 -86,-50" fill="rgba(212, 175, 55, 0.2)" stroke="url(#goldGrad)" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="0,-100 0,35 86,-50" fill="rgba(212, 175, 55, 0.28)" stroke="url(#goldGrad)" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="-86,-50 0,35 -86,50" fill="rgba(212, 175, 55, 0.15)" stroke="url(#goldGrad)" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="86,-50 0,35 86,50" fill="rgba(212, 175, 55, 0.22)" stroke="url(#goldGrad)" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="0,35 0,100 -86,50" fill="rgba(212, 175, 55, 0.35)" stroke="url(#goldGrad)" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="0,35 0,100 86,50" fill="rgba(212, 175, 55, 0.42)" stroke="url(#goldGrad)" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Sound Waves / Resonance Rays -->
    <path d="M-120,-30 A 130 130 0 0 0 -120,30" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>
    <path d="M-140,-50 A 160 160 0 0 0 -140,50" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.6" stroke-linecap="round"/>
    <path d="M120,-30 A 130 130 0 0 1 120,30" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>
    <path d="M140,-50 A 160 160 0 0 1 140,50" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.6" stroke-linecap="round"/>
  </g>

  <!-- Soundscape Text Banner -->
  <text x="256" y="430" text-anchor="middle" font-family="'Cinzel', 'Trajan Pro', Georgia, serif" font-size="34" font-weight="bold" fill="url(#goldGrad)" letter-spacing="3">SOUNDSCAPE</text>
</svg>
